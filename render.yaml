services:
  - type: web
    name: cybersec-lab
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app import create_app; from app.extensions import db; app = create_app(); with app.app_context(): db.create_all()" && python scripts/seed_test_definitions.py && gunicorn "app:create_app()" --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cybersec-lab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EXTERNAL_TARGETS_ENABLED
        value: "false"
      - key: SESSION_LIFETIME_SECONDS
        value: "3600"
      - key: LOG_LEVEL
        value: WARNING
      - key: REPORT_OUTPUT_DIR
        value: instance/reports

databases:
  - name: cybersec-lab-db
    region: oregon
    plan: free
    databaseName: cybersec_lab
    user: cybersec_lab_user
